<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Daniel-John Diala</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light dark; --bg: #fbfaf8; --text: #1c1c1e; --muted: #66666b; --btn: #1c1c1e; --btn-text: #fff; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #161617; --text: #ececee; --muted: #a1a1a8; --btn: #ececee; --btn-text: #161617; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main { width: 100%; max-width: 520px; }
      h1 { margin: 0; font-size: clamp(1.75rem, 6vw, 2.25rem); line-height: 1.2; }
      p { color: var(--muted); line-height: 1.6; }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 10px 16px;
        border-radius: 6px;
        background: var(--btn);
        color: var(--btn-text);
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>The link may be mistyped or out of date. Everything on this site is on one page.</p>
      <a href="/">Go to the home page</a>
    </main>
  </body>
</html>
